schema_version: 1

context:
  version: "1.13.0"

package:
  name: sagemaker-mlops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-mlops/sagemaker_mlops-${{ version }}.tar.gz
  sha256: acb377d2d136e7740761080d521832ce03afeb95d9a0519ab1939e5e64d7077e

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.10.0
    - sagemaker-train >=1.10.0
    - sagemaker-serve >=1.10.0
    - boto3 >=1.42.2,<2.0
    - botocore >=1.42.2,<2.0
    - pyiceberg >=0.8.0
    - pyarrow >=14.0.0
    - s3fs

tests:
  - python:
      imports:
        - sagemaker.mlops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: SageMaker MLOps package for workflow orchestration and model building
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
