schema_version: 1

context:
  version: "1.24.0"

package:
  name: sagemaker-mlops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-mlops/sagemaker_mlops-${{ version }}.tar.gz
  sha256: 1641c216e65f48519d880ae6cc632d76fb279c502210dcd26b0e1195236a9cac

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.10.0
    - sagemaker-train >=1.10.0
    - sagemaker-serve >=1.10.0
    - boto3 >=1.42.2,<2.0
    - botocore >=1.42.2,<2.0
    - pyiceberg >=0.8.0
    - pyarrow >=14.0.0
    - s3fs
  # protobuf arrives transitively via sagemaker-train/sagemaker-serve -> mlflow ->
  # databricks-sdk, which forbids protobuf 5.26-5.28.* and 5.29.0-4. Without this the
  # solver backtracks to protobuf 5.28.3 and `pip check` fails. Soft-constrain protobuf
  # to the databricks-sdk-compatible window.
  run_constraints:
    - protobuf >=5.29.5,<7

tests:
  - python:
      imports:
        - sagemaker.mlops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: SageMaker MLOps package for workflow orchestration and model building
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
    - aviruthen
