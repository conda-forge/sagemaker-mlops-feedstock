schema_version: 1

context:
  version: "1.8.0"

package:
  name: sagemaker-mlops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-mlops/sagemaker_mlops-${{ version }}.tar.gz
  sha256: b4738d72b3c2e11a54ef9a751db6b5e33fa863556732cb3b8161698d4b4af2f1

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.5.0
    - sagemaker-train >=1.5.0
    - sagemaker-serve >=1.5.0
    - boto3 >=1.42.2,<2.0
    - botocore >=1.42.2,<2.0

tests:
  - python:
      imports:
        - sagemaker.mlops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: SageMaker MLOps package for workflow orchestration and model building
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
